<svg
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Gradiente do código -->
    <linearGradient id="purpleRain"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

      <stop offset="0%" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="20%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>

    </linearGradient>

    <!-- Brilho do texto -->
    <filter id="glow">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>

    <!-- Brilho mais forte -->
    <filter id="strongGlow">

      <feGaussianBlur
        stdDeviation="7"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>

  </defs>


