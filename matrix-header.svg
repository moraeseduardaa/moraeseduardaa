<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="300"
     viewBox="0 0 1200 300">

  <style>
    .matrix {
      font-family: monospace;
      font-size: 16px;
      fill: #a855f7;
      opacity: 0.55;
    }

    .bright {
      fill: #c084fc;
      opacity: 0.8;
    }

    .name {
      font-family: monospace;
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 3px;
      fill: white;
    }

    .subtitle {
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 4px;
      fill: #c084fc;
    }
  </style>


  <!-- MATRIX ESQUERDA -->

  <g class="matrix">

    <text x="30" y="-20">
      101010
      <animate attributeName="y"
               from="-100"
               to="350"
               dur="4s"
               repeatCount="indefinite"/>
    </text>

    <text x="90" y="-80">
      011001
      <animate attributeName="y"
               from="-180"
               to="350"
               dur="5s"
               repeatCount="indefinite"/>
    </text>

    <text x="150" y="-40">
      110101
      <animate attributeName="y"
               from="-140"
               to="350"
               dur="6s"
               repeatCount="indefinite"/>
    </text>

    <text x="220" y="-100">
      001101
      <animate attributeName="y"
               from="-200"
               to="350"
               dur="4.5s"
               repeatCount="indefinite"/>
    </text>

    <text x="280" y="-60">
      101100
      <animate attributeName="y"
               from="-160"
               to="350"
               dur="5.5s"
               repeatCount="indefinite"/>
    </text>

    <text x="340" y="-120">
      010011
      <animate attributeName="y"
               from="-220"
               to="350"
               dur="6.5s"
               repeatCount="indefinite"/>
    </text>

  </g>


  <!-- MATRIX DIREITA -->

  <g class="matrix">

    <text x="820" y="-40">
      101101
      <animate attributeName="y"
               from="-140"
               to="350"
               dur="5s"
               repeatCount="indefinite"/>
    </text>

    <text x="880" y="-100">
      010110
      <animate attributeName="y"
               from="-200"
               to="350"
               dur="6s"
               repeatCount="indefinite"/>
    </text>

    <text x="940" y="-20">
      110010
      <animate attributeName="y"
               from="-120"
               to="350"
               dur="4s"
               repeatCount="indefinite"/>
    </text>

    <text x="1000" y="-80">
      001011
      <animate attributeName="y"
               from="-180"
               to="350"
               dur="5.5s"
               repeatCount="indefinite"/>
    </text>

    <text x="1060" y="-40">
      101010
      <animate attributeName="y"
               from="-140"
               to="350"
               dur="4.5s"
               repeatCount="indefinite"/>
    </text>

    <text x="1120" y="-120">
      011101
      <animate attributeName="y"
               from="-220"
               to="350"
               dur="6.5s"
               repeatCount="indefinite"/>
    </text>

  </g>


  <!-- CÓDIGO MAIS PRÓXIMO DO CENTRO -->

  <g class="bright">

    <text x="410" y="-30">
      {JAVA}
      <animate attributeName="y"
               from="-150"
               to="350"
               dur="5s"
               repeatCount="indefinite"/>
    </text>

    <text x="470" y="-100">
      &lt;/&gt;
      <animate attributeName="y"
               from="-220"
               to="350"
               dur="6s"
               repeatCount="indefinite"/>
    </text>

    <text x="730" y="-60">
      {CODE}
      <animate attributeName="y"
               from="-180"
               to="350"
               dur="5.5s"
               repeatCount="indefinite"/>
    </text>

    <text x="790" y="-120">
      &lt;/&gt;
      <animate attributeName="y"
               from="-240"
               to="350"
               dur="4.5s"
               repeatCount="indefinite"/>
    </text>

  </g>


  <!-- NOME -->

  <text
    class="name"
    x="600"
    y="135"
    text-anchor="middle">

    EDUARDA MORAES

  </text>


  <!-- SUBTÍTULO -->

  <text
    class="subtitle"
    x="600"
    y="170"
    text-anchor="middle">

    SOFTWARE ENGINEERING

  </text>


  <!-- CURSOR -->

  <rect
    x="810"
    y="151"
    width="9"
    height="20"
    fill="#c084fc">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>

  </rect>

</svg>
